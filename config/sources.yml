  # Industry / organization sources
  - {name: "Rubber World", type: rss, enabled: true, url: "https://rubberworld.com/category/rss6/feed/", source_score: 8, homepage: "https://rubberworld.com/"}
  - {name: "Rubber News", type: manual, enabled: false, source_score: 7, homepage: "https://www.rubbernews.com/", notes: "No verified stable public RSS/API configured."}
  - {name: "Rubber Division ACS", type: manual, enabled: false, source_score: 8, homepage: "https://www.rubber.org/", notes: "News page retained for later RSS/API integration."}

  # Broad discovery sources
  - name: "IEEE Xplore via OpenAlex"
    type: openalex_search
    enabled: true
    search: "silicone rubber OR silicone elastomer"
    source_name_contains: "IEEE"
    source_score: 13
    homepage: "https://ieeexplore.ieee.org/Xplore/home.jsp"

  - name: "OpenAlex broad silicone discovery"
    type: openalex_search
    enabled: true
    search: "silicone rubber OR liquid silicone rubber OR silicone elastomer"
    source_score: 10
    homepage: "https://openalex.org/"

  # Existing manual sources retained
  - {name: "Google Scholar", type: manual, enabled: false, source_score: 0, homepage: "https://scholar.google.com/"}
